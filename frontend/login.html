<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Welcome back. · Taskwell</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet"><link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page" data-auth-mode="login">
  <main class="auth-layout">
    <section class="auth-story"><a href="login.html" class="brand"><span class="brand-icon">✓</span> taskwell<span class="brand-dot">.</span></a><div><span class="note-spark">✳</span><h1>A little progress,<br>every day.</h1><p>Less overwhelm. More space for what matters.</p></div><span>Your everyday, organized.</span></section>
    <section class="auth-form-panel"><div class="auth-card"><div class="eyebrow">YOUR PERSONAL WORKSPACE</div><h2>Welcome back.</h2><p class="auth-description">A little focus starts here. Log in to your workspace.</p>
      <div id="auth-message" role="status" aria-live="polite" hidden></div>
      <form id="auth-form"><label class="form-label" for="email">Email address</label><input id="email" name="email" class="form-control mb-3" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"><label class="form-label" for="password">Password</label><input id="password" name="password" class="form-control mb-3" type="password" autocomplete="current-password" required minlength="1" maxlength="128"><button class="btn btn-green w-100" type="submit">Log in</button></form>
      <nav class="auth-links" aria-label="Account"><a href="forgot-password.html">Forgot password?</a><span>New here? <a href="signup.html">Create an account</a></span></nav>
      <p class="auth-footnote">A calmer day, one task at a time.</p>
    </div></section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js?v=2"></script><script src="js/auth.js"></script>
</body>
</html>
